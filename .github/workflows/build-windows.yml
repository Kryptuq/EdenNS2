name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK (glslangValidator)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\vulkan_sdk.exe" -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed: $($p.ExitCode)" }
          $bin = Get-ChildItem "C:\VulkanSDK" -Recurse -Filter glslangValidator.exe | Select-Object -First 1
          $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $bin.FullName --version

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-windows-${{ hashFiles('**/cpmfile.json') }}
          restore-keys: cpm-windows-

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYUZU_TESTS=OFF -DDYNARMIC_TESTS=OFF -DENABLE_UPDATE_CHECKER=OFF -DYUZU_CMD=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel -- -k 0 2>&1 | tee build.log

      # Surface errors as annotations so they are readable through the API
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          for f in configure.log build.log; do
            [ -f "$f" ] || continue
            grep -n -E 'LNK[0-9]{4}|error C[0-9]{4}|fatal error|FAILED:|CMake Error|undefined reference|: error:' "$f" | grep -v -E 'warning (LNK|C)[0-9]{4}' | head -c 30000 > errs.txt || true
            tail -c 12000 "$f" > tail.txt
            for part in errs tail; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' ${part}.txt | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f $part::$msg"
            done
          done

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/bin/* dist/
          Get-ChildItem dist -Recurse -Include *.pdb,*.lib,*.exp,*.ilk | Remove-Item -Force
          # Include the Visual C++ runtime so eden.exe starts without installing it separately
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)\*.dll" dist/ }
          Copy-Item NS2_PATCH_NOTES.md dist/
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eden-ns2-windows-x64
          path: dist/
          retention-days: 30

      - name: Zip for release
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath eden-ns2-windows-x64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Eden NS2 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: eden-ns2-windows-x64.zip
          body: |
            Windows x64 build of Eden with the experimental NS2 (Switch 2) patch, built from ${{ github.sha }}.

            Unzip and run `eden.exe`. The Qt libraries and the Visual C++ runtime are included.
            Experimental: Switch 2 titles will most likely not run, and regular Switch games may behave differently than in stock Eden.
