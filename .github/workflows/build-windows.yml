name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK (glslangValidator)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\vulkan_sdk.exe" -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed: $($p.ExitCode)" }
          $bin = Get-ChildItem "C:\VulkanSDK" -Recurse -Filter glslangValidator.exe | Select-Object -First 1
          $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $bin.FullName --version

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-windows-${{ hashFiles('**/cpmfile.json') }}
          restore-keys: cpm-windows-

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYUZU_TESTS=OFF -DDYNARMIC_TESTS=OFF -DENABLE_UPDATE_CHECKER=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel -- -k 0 2>&1 | tee build.log

      # Surface errors as annotations so they are readable through the API
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          for f in configure.log build.log; do
            [ -f "$f" ] || continue
            grep -n -E 'LNK[0-9]{4}|error C[0-9]{4}|fatal error|FAILED:|CMake Error|undefined reference|: error:' "$f" | head -c 30000 > errs.txt || true
            tail -c 12000 "$f" > tail.txt
            for part in errs tail; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' ${part}.txt | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f $part::$msg"
            done
          done

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/bin/* dist/
          Get-ChildItem dist -Recurse -Include *.pdb,*.lib,*.exp,*.ilk | Remove-Item -Force
          # Include the Visual C++ runtime so eden.exe starts without installing it separately
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)\*.dll" dist/ }
          Copy-Item NS2_PATCH_NOTES.md dist/
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eden-ns2-windows-x64
          path: dist/
          retention-days: 30
